name: Database tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "db/**"
      - "supabase/**"
      - "tests/**"
      - "lib/**"
      - "proxy.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Supabase integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request merge ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Start Supabase
        run: npx supabase start

      - name: Apply migrations and seed data
        run: npx supabase db reset --yes

      - name: Export Supabase test environment
        run: |
          status="$(npx supabase status -o json)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' <<< "$status")"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r '.PUBLISHABLE_KEY' <<< "$status")"
            echo "NEXT_PRIVATE_SUPABASE_SECRET_KEY=$(jq -r '.SECRET_KEY' <<< "$status")"
            echo "DATABASE_URL=$(jq -r '.DB_URL' <<< "$status")"
          } >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test

      - name: Stop Supabase
        if: always()
        run: npx supabase stop
